name: Build Timer Dashboard Web and APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: timer-dashboard-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Maven Central fallback
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/repositories.init.gradle" <<'GRADLE'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://repo1.maven.org/maven2' }
                  }
              }
              repositories {
                  maven { url 'https://repo1.maven.org/maven2' }
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url 'https://repo1.maven.org/maven2' }
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url 'https://repo1.maven.org/maven2' }
              }
          }
          GRADLE
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --init-script "$RUNNER_TEMP/repositories.init.gradle" assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Timer-Dashboard-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
